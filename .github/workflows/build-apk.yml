name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.15.1

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Signing Keystore
        id: setup-keystore
        shell: bash
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/release-key.jks"

          if [ -z "${APK_KEYSTORE_PASSWORD:-}" ] || [ -z "${APK_KEYSTORE_BASE64:-}" ]; then
            echo "Required Android signing secrets are not configured." >&2
            echo "Configure APK_KEYSTORE_PASSWORD and APK_KEYSTORE_BASE64 in GitHub Actions Secrets before producing a release APK." >&2
            exit 1
          fi

          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "APK_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "APK_KEYSTORE_PASSWORD=$APK_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Create ephemeral CI test credentials
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "DEVELOPER_PANEL_USERNAME=ci-developer"
            echo "DEVELOPER_PANEL_PASSWORD=$(openssl rand -base64 36 | tr -d '\n')"
          } >> "$GITHUB_ENV"

      - name: Run Type Check & Tests
        run: |
          pnpm check
          pnpm test

      - name: Build Web Assets
        run: pnpm build

      - name: Build Signed Android APK
        run: pnpm android:build

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghorfat-almalabes-signed-release-apk
          path: artifacts/ghorfat-almalabes-release.apk
          if-no-files-found: error

