name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found after setup (ANDROID_HOME/ANDROID_SDK_ROOT empty or missing)."
            exit 1
          fi
          echo "Android SDK: $SDK"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Signing Keystore (Optional)
        id: setup-keystore
        shell: bash
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/release-key.jks"

          if [ -n "${APK_KEYSTORE_BASE64:-}" ] && [ -n "${APK_KEYSTORE_PASSWORD:-}" ]; then
            echo "Configuring signing keystore..."
            if ! printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH" 2>/dev/null; then
              rm -f "$KEYSTORE_PATH"
              echo "::error::APK_KEYSTORE_BASE64 is not valid base64. Re-encode the raw .jks with: base64 -w0 release-key.jks"
              exit 1
            fi
            chmod 600 "$KEYSTORE_PATH"
            MAGIC="$(head -c 2 "$KEYSTORE_PATH" | od -An -tx1 | tr -d ' \n')"
            if [ "$MAGIC" = "504b" ]; then
              rm -f "$KEYSTORE_PATH"
              echo "::error::Decoded APK_KEYSTORE_BASE64 is a ZIP archive, not a keystore. Unzip the downloaded artifact first, then encode release-key.jks itself (base64 -w0 release-key.jks)."
              exit 1
            fi
            if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass:env APK_KEYSTORE_PASSWORD -alias marwan-ghorfatalmalabes-release > /dev/null 2>&1; then
              rm -f "$KEYSTORE_PATH"
              echo "::error::Keystore validation failed: file is not a readable keystore, the password is wrong, or alias 'marwan-ghorfatalmalabes-release' is missing."
              exit 1
            fi
            echo "Keystore validated (alias found)."
            echo "APK_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "APK_KEYSTORE_PASSWORD=$APK_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No keystore secrets found; building unsigned/debug APK for field testing."
          fi

      - name: Create ephemeral CI test credentials
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "DEVELOPER_PANEL_USERNAME=ci-developer"
            echo "DEVELOPER_PANEL_PASSWORD=$(openssl rand -base64 36 | tr -d '\n')"
          } >> "$GITHUB_ENV"

      - name: Run Type Check & Tests
        run: |
          pnpm check
          pnpm test

      - name: Build Web Assets
        run: pnpm build

      - name: Build Android APK
        run: pnpm android:build

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghorfat-almalabes-apk
          path: artifacts/*.apk
          if-no-files-found: error
